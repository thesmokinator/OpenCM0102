[package]
name = "opencm0102"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenCM0102 native application"

[[bin]]
name = "opencm0102"
path = "src/main.rs"

[dependencies]
cm0102-core = { path = "../crates/cm0102-core" }
cm0102-db = { path = "../crates/cm0102-db" }
cm0102-match = { path = "../crates/cm0102-match" }
eframe = "0.31"
fluent = "0.17"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
rfd = "0.16"
rusqlite = { version = "0.39", features = ["bundled"] }
rust-embed = "8"
serde_json = { workspace = true }
sys-locale = "0.3"
unic-langid = "0.9"
